<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spreadsheet Gym Sesi 03 Storyboard</title>
<style>
@font-face { font-family: 'Archivo Black'; src: url('../../spreadsheet-gym-formula-vs-function/public/fonts/ArchivoBlack.woff2'); }
@font-face { font-family: 'Space Grotesk'; src: url('../../spreadsheet-gym-formula-vs-function/public/fonts/SpaceGrotesk.woff2'); font-weight: 300 700; }
@font-face { font-family: 'Space Mono'; src: url('../../spreadsheet-gym-formula-vs-function/public/fonts/SpaceMono-Bold.woff2'); font-weight: 700; }
@font-face { font-family: 'Space Mono'; src: url('../../spreadsheet-gym-formula-vs-function/public/fonts/SpaceMono-Regular.woff2'); font-weight: 400; }
:root { --bg:#F2FFF5; --ink:#111; --green:#7CF29A; --blue:#5AC8FF; --yellow:#FFD600; --pink:#FF7AC6; --red:#FF5A5A; --fx:#157A3A; --sel:#1A73E8; --cream:#FFF1C9; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
.page { width: 1680px; padding: 40px; }
h1 { font-family: 'Archivo Black'; font-size: 44px; margin: 0 0 6px; }
.sub { font-size: 20px; margin-bottom: 28px; }
.sub code, .fx { font-family: 'Space Mono'; font-weight: 700; color: var(--fx); }
.grid { display: grid; grid-template-columns: repeat(4, 360px); gap: 36px 40px; }
.cell { display: flex; flex-direction: column; gap: 10px; }
.num { font-family: 'Archivo Black'; font-size: 20px; display: flex; justify-content: space-between; }
.num span { font-family: 'Space Mono'; font-size: 15px; font-weight: 700; }
.frame { position: relative; width: 360px; height: 640px; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--bg);
  background-image: linear-gradient(90deg, rgba(17,17,17,.1) 1px, transparent 1px), linear-gradient(rgba(17,17,17,.1) 1px, transparent 1px); background-size: 53px 21px; box-shadow: 6px 6px 0 var(--ink); }
.safe { position: absolute; left: 20px; top: 95px; width: 293px; height: 405px; border: 2px dashed #FF9F0A; border-radius: 4px; pointer-events: none; z-index: 9; }
.strip { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: var(--ink); color: #fff; font: 700 9px 'Space Mono'; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; letter-spacing: 1px; }
.head { position: absolute; left: 20px; top: 95px; width: 293px; height: 26px; display: flex; gap: 5px; z-index: 3; }
.chip { background: var(--green); border: 2px solid var(--ink); border-radius: 6px; font: 700 9px 'Space Mono'; padding: 0 6px; display: flex; align-items: center; white-space: nowrap; transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--ink); }
.bar { flex: 1; background: #fff; border: 2px solid var(--ink); border-radius: 6px; display: flex; align-items: center; overflow: hidden; box-shadow: 2px 2px 0 var(--ink); }
.bar i { font: italic 700 11px 'Space Mono'; padding: 0 6px; border-right: 2px solid var(--ink); align-self: stretch; display: flex; align-items: center; }
.bar b { font: 700 9.5px 'Space Mono'; color: var(--fx); padding: 0 6px; white-space: nowrap; }
.cap { position: absolute; left: 30px; right: 47px; top: 452px; background: #fff; border: 2px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); font: 700 12px 'Space Grotesk'; text-align: center; padding: 5px 8px; z-index: 4; }
.cap em { font-style: normal; background: var(--green); border-radius: 4px; padding: 0 3px; }
.st { position: absolute; transform: translate(-50%, -50%); z-index: 5; }
.box { background: #fff; border: 2px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); padding: 5px 9px; white-space: nowrap; }
.big { font-family: 'Archivo Black'; }
.tilt-l { transform: translate(-50%,-50%) rotate(-3deg); } .tilt-r { transform: translate(-50%,-50%) rotate(3deg); }
.mono { font-family: 'Space Mono'; font-weight: 700; }
table.sh { border-collapse: collapse; background: #fff; font: 700 9px 'Space Mono'; }
table.sh td, table.sh th { border: 1px solid #D5D9DE; height: 17px; padding: 0 4px; white-space: nowrap; }
table.sh th { background: #EEF1F4; color: #555; font-size: 8px; }
table.sh td.n { text-align: right; }
.win { background: #fff; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; box-shadow: 4px 4px 0 var(--ink); }
.win .tb { background: var(--fx); color: #fff; font: 700 9px 'Archivo Black'; padding: 4px 8px; border-bottom: 2px solid var(--ink); }
.win .fb { font: 700 9px 'Space Mono'; padding: 4px 6px; border-bottom: 2px solid var(--ink); color: var(--fx); white-space: nowrap; overflow: hidden; }
.selc { outline: 2px solid var(--sel); outline-offset: -2px; }
.hl-b { background: #5AC8FF44; } .hl-c { background: #FF7AC644; } .hl-d { background: #7CF29A66; }
.zero { color: var(--red); }
.vo { font-size: 13.5px; line-height: 1.35; }
.vo b { font-weight: 700; }
.note { font-size: 12px; color: #5B5240; }
.strike { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: var(--red); }
.tok { display: inline-block; border: 2px solid var(--ink); border-radius: 6px; padding: 1px 5px; margin: 0 2px; background: #fff; font: 700 11px 'Space Mono'; }
</style>
</head>
<body>
<div class="page">
  <h1>Spreadsheet Gym · Sesi 03 · Rapikan nomor HP: storyboard</h1>
  <div class="sub">12 panels, 1/3 scale (360×640 = 1080×1920). Orange dashed box = safe area (x 60–940, y 285–1500). The top bar asks <code style="font-family:'Space Grotesk';color:#111">1 rumus, semua nomor rapi?</code> until panel 6, then shows <code>=REGEXREPLACE(A2&amp;"";"^(\+62|62|0)";"")</code></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const Q = `<div class="head"><div class="chip">▮▬▮ GYM · SESI 03</div><div class="bar"><i>fx</i><b style="color:#111;font-family:'Space Grotesk'">1 rumus, semua nomor rapi?</b></div></div>`;
const A = `<div class="head"><div class="chip">▮▬▮ GYM · SESI 03</div><div class="bar"><i>fx</i><b style="font-size:8px">=REGEXREPLACE(A2&amp;"";"^(\\+62|62|0)";"")</b></div></div>`;
const strip = `<div class="strip"><span>SPREADSHEET GYM</span><span>@faqihpedia</span></div>`;
const at = (x, y, html, cls = '') => `<div class="st ${cls}" style="left:${x}px;top:${y}px">${html}</div>`;
const cap = (h) => `<div class="cap">${h}</div>`;
const NUMS = [['+62', '812345678'], ['0', '8112345678'], ['62', '85210345678'], ['', '812345678'], ['+62', '8771234567'], ['62', '822123456']];
// phone sheet: mode 'raw' | 'hl' (prefix highlighted) | 'strike' (prefix struck) ; b: column B values or null
function phones({ mode = 'raw', b = null, bcls = [], fbar = '', title = 'pelanggan.xlsx', colB = 'Format 8xxx', sel = 0, w = 270, bh = null }) {
  let h = `<div class="win" style="width:${w}px"><div class="tb">● ● ● ${title}</div><div class="fb">${fbar}</div><table class="sh" style="width:100%"><tr><th></th><th>A</th><th>B</th></tr>`;
  h += `<tr><th>1</th><td style="font-family:'Space Grotesk';font-weight:700">Nomor HP</td><td style="font-family:'Space Grotesk';font-weight:700">${colB}</td></tr>`;
  NUMS.forEach(([p, n], i) => {
    const pre = !p ? '' : mode === 'hl' ? `<span style="background:#FFD600">${p}</span>` : mode === 'strike' ? `<span class="strike">${p}</span>` : p;
    const bv = b ? (b[i] ?? '') : '';
    h += `<tr><th>${i + 2}</th><td>${pre}${n}</td><td class="n ${bcls[i] ?? ''} ${sel === i + 2 ? 'selc' : ''}">${bv}</td></tr>`;
  });
  return h + `</table></div>`;
}
const CLEAN = NUMS.map(([, n]) => n);
const P = [
  { t: 'Hook', d: '0–4 s', html: `${Q}
    ${at(166, 165, `<div class="box big" style="background:var(--red);color:#fff;font-size:20px">Campur aduk!</div>`, 'tilt-l')}
    ${at(166, 290, phones({ mode: 'hl', w: 230 }))}
    ${at(166, 420, `<div class="box big" style="background:var(--green);font-size:18px">1 rumus, beres</div>`, 'tilt-r')}
    ${cap('Nomor HP pelanggan formatnya <em>campur aduk?</em>')}`,
    vo: 'Nomor HP pelanggan / formatnya <b>campur aduk</b>? ↗ Satu rumus, / <b>beres</b>. ↘', note: 'The prefixes flash yellow and the column shakes. "1 rumus, beres" thumps in.' },
  { t: 'Bumper', d: '4–6 s', html: `${Q}
    ${at(166, 220, `<div style="display:flex;gap:2px;align-items:center"><div class="box" style="width:30px;height:56px;padding:0;background:repeating-linear-gradient(#fff 0 17px,#111 17px 19px)"></div><div style="width:70px;height:10px;background:#fff;border:2px solid #111;font:italic 700 7px 'Space Mono';text-align:center">fx</div><div class="box" style="width:30px;height:56px;padding:0;background:repeating-linear-gradient(#fff 0 17px,#111 17px 19px)"></div></div>`)}
    ${at(166, 300, `<div class="box big" style="background:var(--green);font-size:24px">SPREADSHEET GYM</div>`, 'tilt-l')}
    ${at(166, 360, `<div class="box big" style="font-size:18px">Sesi 03</div>`, 'tilt-r')}
    ${cap('Balik lagi di Spreadsheet Gym, sesi <em>03</em>.')}`,
    vo: 'Balik lagi di Spreadsheet Gym, / sesi <b>tiga</b>. ↘', note: 'Coach whistle. Same logo pop as sesi 01 and 02.' },
  { t: 'Warm-up', d: '6–16 s', html: `${Q}
    ${at(166, 150, `<div class="box" style="border-radius:12px"><div class="mono" style="font-size:8px">Bos:</div><div style="font-weight:700;font-size:12px">Kirim promo lewat WA ya</div></div>`)}
    ${at(166, 300, phones({ mode: 'hl' }))}
    ${at(80, 420, `<span class="tok" style="background:var(--yellow)">+62</span>`)}${at(130, 420, `<span class="tok" style="background:var(--yellow)">0</span>`)}${at(175, 420, `<span class="tok" style="background:var(--yellow)">62</span>`)}${at(230, 420, `<span class="tok" style="background:var(--green)">8…</span>`)}
    ${cap('ada yang +62, ada yang 0, ada yang 62, ada yang langsung <em>8</em>.')}`,
    vo: 'Bos minta kirim promo lewat <b>WhatsApp</b>. ↘ Tapi nomor di datanya campur aduk: / ada yang plus enam dua, / ada yang nol, / ada yang enam dua, / ada yang langsung <b>delapan</b>. ↘', note: 'Each prefix lights up as it is said, and its chip pops below the sheet.' },
  { t: 'The problem', d: '16–22 s', html: `${Q}
    ${at(166, 160, `<div class="box big" style="font-size:16px">Target: awalan <span style="background:var(--green)">8</span></div>`, 'tilt-l')}
    ${at(166, 300, phones({ mode: 'raw', b: ['812345678', '', '', '', '', ''], bcls: ['hl-d'], sel: 3 }))}
    ${at(240, 410, `<div class="box big" style="background:var(--red);color:#fff;font-size:13px">500 nomor manual?</div>`, 'tilt-r')}
    ${cap('Kalau diedit manual, kapan <em>kelarnya?</em>')}`,
    vo: 'Semuanya harus diseragamin / jadi awalan delapan. ↘ Kalau diedit manual, / lima ratus nomor… / kapan <b>kelarnya</b>? ↗', note: 'A cursor retypes one number by hand while a counter shows "1 / 500".' },
  { t: 'Pause dulu', d: '22–27 s', html: `${Q}
    ${at(166, 170, `<div class="box big" style="background:var(--yellow);font-size:24px">PAUSE DULU</div>`, 'tilt-l')}
    ${at(166, 290, `<div style="width:150px;height:150px;border-radius:50%;border:3px solid #111;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 12px var(--green)"><div class="big" style="font-size:60px;line-height:1">3</div><div class="mono" style="font-size:10px">detik</div></div>`)}
    ${at(166, 410, `<div class="box" style="border-radius:12px"><div class="mono" style="font-size:8px">Komentar</div><div class="mono" style="font-size:12px;color:var(--fx)">=??? <span style="background:var(--yellow);color:#111">tebak!</span></div></div>`)}
    ${cap('Pause dulu, coba tebak rumusnya di <em>komen!</em>')}`,
    vo: 'Pause dulu, / coba tebak rumusnya di <b>komen</b>! ↘ <i>(3 s timer)</i>', note: 'Same timer as sesi 02, now 3 seconds.' },
  { t: 'Move 1: the answer', d: '27–36 s', html: `${A}
    ${at(166, 150, `<div class="box big" style="background:var(--green);font-size:20px">REGEXREPLACE</div>`, 'tilt-l')}
    ${at(166, 290, phones({ mode: 'raw', b: ['812345678', '', '', '', '', ''], bcls: ['hl-d'], sel: 2, fbar: '=REGEXREPLACE(A2&amp;"";"^(\\+62|62|0)";"")' }))}
    ${at(166, 408, `<div style="display:flex;gap:4px"><span class="tok">A2</span><span class="tok" style="background:var(--yellow)">pola</span><span class="tok" style="background:#EEF1F4">"" kosong</span></div>`)}
    ${cap('Jawabannya: <em>REGEXREPLACE</em>.')}`,
    vo: 'Jawabannya: / <b>REGEXREPLACE</b>. ↘ Tulis di B dua: / REGEXREPLACE, / A dua, / terus polanya, / terus ganti sama <b>kosong</b>. ↘', note: 'The top bar switches from the question to the formula. B2 types it piece by piece on "A dua", "polanya", "kosong".' },
  { t: 'Move 2: the pattern', d: '36–45 s', html: `${A}
    ${at(166, 160, `<div class="box mono" style="font-size:16px;color:var(--fx)">^( \\+62 | 62 | 0 )</div>`)}
    ${at(166, 215, `<div style="display:flex;gap:5px"><span class="tok" style="background:var(--yellow)">^ = di awal</span><span class="tok" style="background:var(--blue)">| = atau</span></div>`)}
    ${at(166, 330, phones({ mode: 'strike', w: 230 }))}
    ${cap('Kalau di awal ada +62, 62, atau 0: <em>hapus</em>.')}`,
    vo: 'Polanya dibaca gini: / tanda topi artinya <b>di awal</b>. ↘ Garis tegak artinya <b>atau</b>. ↘ Jadi kalau di awal ada plus enam dua, / enam dua, / atau nol, / <b>hapus</b>. ↘', note: 'The pattern splits into chips as each part is explained. Then every matching prefix gets a red strike.' },
  { t: 'Move 3: the trap', d: '45–54 s', html: `${A}
    ${at(166, 150, `<div class="box big" style="background:var(--red);color:#fff;font-size:18px">JEBAKAN!</div>`, 'tilt-l')}
    ${at(166, 280, phones({ mode: 'raw', b: ['812345678', '8112345678', '<span class="zero">#VALUE!</span>', '<span class="zero">#VALUE!</span>', '', ''], bcls: ['hl-d', 'hl-d', '', ''], fbar: '=REGEXREPLACE(A4<span style="background:#FFD600">&amp;""</span>;…)' }))}
    ${at(166, 400, `<div class="box" style="font-size:11px;font-weight:700">angka → <span class="mono" style="background:var(--yellow)">&amp;""</span> → teks ✓</div>`, 'tilt-r')}
    ${cap('REGEXREPLACE cuma mau <em>teks</em>.')}`,
    vo: 'Tapi ada satu <b>jebakan</b>. ↘ Nomor yang diketik tanpa plus / kebaca sebagai <b>angka</b>, / dan REGEXREPLACE cuma mau <b>teks</b>. ↘ Tambahin dan, petik, petik, / biar jadi teks. ↘', note: 'Rows typed as plain numbers show red #VALUE!. &"" slides into the formula (yellow) and the errors turn into tidy numbers.' },
  { t: 'Move 4: one column', d: '54–61 s', html: `${A}
    ${at(166, 150, `<div class="box big" style="background:var(--green);font-size:16px">+ ARRAYFORMULA</div>`, 'tilt-l')}
    ${at(166, 290, phones({ mode: 'raw', b: CLEAN, bcls: CLEAN.map(() => 'hl-d'), fbar: '=ARRAYFORMULA(IF(A2:A="";"";REGEXREPLACE(A2:A&amp;"";…)))' }))}
    ${at(166, 410, `<div class="box big" style="font-size:12px">Ingat sesi 02 ↩</div>`, 'tilt-r')}
    ${cap('Lima ratus nomor, <em>satu rumus</em>.')}`,
    vo: 'Mau satu kolom <b>sekaligus</b>? ↗ Inget sesi dua: / bungkus pakai <b>ARRAYFORMULA</b>. ↘ Lima ratus nomor, / satu rumus. ↘', note: 'Callback card to sesi 02. Column B fills top to bottom in a wave.' },
  { t: 'Takeaway', d: '61–66 s', html: `${A}
    ${at(166, 150, `<div class="box big" style="background:#111;color:var(--green);font-size:16px">INTINYA</div>`, 'tilt-l')}
    ${at(90, 290, `<div class="box mono" style="font-size:9px;line-height:1.7;white-space:normal;width:110px">${NUMS.map(([p, n]) => `<div>${p ? `<span class="strike">${p}</span>` : ''}${n}</div>`).join('')}</div>`)}
    ${at(166, 290, `<div class="big" style="font-size:24px">→</div>`)}
    ${at(242, 290, `<div class="box mono" style="font-size:9px;line-height:1.7;background:#C9F9D5;width:100px">${CLEAN.map((n) => `<div>${n}</div>`).join('')}</div>`)}
    ${cap('Semua nomor jadi <em>seragam</em>.')}`,
    vo: 'Intinya: / hapus awalannya, / sisain angka <b>delapan</b>. ↘ Semua nomor jadi <b>seragam</b>. ↘', note: 'Before → after: the struck prefixes fly off and the right column turns green.' },
  { t: 'Latihan', d: '66–74 s', html: `${A}
    ${at(166, 150, `<div class="box big" style="background:var(--yellow);font-size:20px">LATIHAN</div>`, 'tilt-l')}
    ${at(166, 275, phones({ mode: 'raw', b: CLEAN.map(() => '<b style="color:#1A73E8">?</b>'), colB: 'Link WA', fbar: '=??? ', title: 'latihan.xlsx' }).replace('Nomor HP</td>', 'Format 8xxx</td>').replace(/\+62|>0(?=8)|>62(?=8)/g, (m) => m.startsWith('>') ? '>' : ''))}
    ${at(166, 400, `<div class="box mono" style="font-size:11px;background:var(--blue)">wa.me/62812345678</div>`, 'tilt-r')}
    ${cap('Bikin <em>link WhatsApp</em> otomatis!')}`,
    vo: 'Sekarang latihan: / dari nomor yang udah rapi, / bikin <b>link WhatsApp</b> otomatis: / wa titik me, / garis miring, / enam dua, / terus nomornya. ↘ Jawab di komen! ↘', note: 'Pinned answer: =ARRAYFORMULA(IF(B2:B="";"";"https://wa.me/62"&B2:B))' },
  { t: 'CTA', d: '74–80 s', html: `${A}
    ${at(110, 160, `<div style="font-size:42px;line-height:1">❤️</div>`)}${at(220, 160, `<div style="font-size:42px;line-height:1">🔖</div>`)}
    ${at(166, 215, `<div class="big" style="font-size:13px">Like &amp; save biar gak lupa</div>`)}
    ${at(166, 290, `<div class="box" style="font-weight:700;font-size:11px">✈ Share ke temen yang datanya masih campur aduk</div>`)}
    ${at(166, 360, `<div class="box big" style="font-size:16px;background:var(--green)">+ Follow</div>`)}
    ${at(166, 415, `<div style="display:flex;gap:6px"><span class="box mono" style="font-size:9px;background:var(--green)">SESI 04 ?</span><span class="box mono" style="font-size:9px">SESI 05 ?</span></div>`)}
    ${cap('Follow, biar gak ketinggalan <em>sesi berikutnya!</em>')}`,
    vo: 'Like dan save / biar gak lupa! ↘ Share ke temen yang datanya / masih campur aduk, / terus <b>follow</b>, / biar gak ketinggalan sesi berikutnya! ↘', note: 'Same CTA as sesi 02: heart, bookmark, share card, and a cursor tapping Follow.' },
];
document.getElementById('grid').innerHTML = P.map((p, i) => `
  <div class="cell">
    <div class="num">${i + 1}. ${p.t}<span>${p.d}</span></div>
    <div class="frame">${p.html}${strip}<div class="safe"></div></div>
    <div class="vo">${p.vo}</div>
    <div class="note">${p.note}</div>
  </div>`).join('');
</script>
</body>
</html>
